name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
        timeout-minutes: 30
      # One invocation per file: a single `flutter test` run cannot host
      # multiple files that each boot the full app (later files fail to
      # attach). `flutter test` is headless, no xvfb needed.
      - run: for f in integration_test/*_test.dart; do flutter test "$f" --no-pub || exit 1; done
        timeout-minutes: 30
