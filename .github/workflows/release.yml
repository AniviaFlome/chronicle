name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
        timeout-minutes: 30

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/chronicle-upload.jks

      - name: Build signed universal APK
        env:
          CHRONICLE_KEYSTORE: ${{ github.workspace }}/android/keystore/chronicle-upload.jks
          CHRONICLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONICLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONICLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f android/keystore/chronicle-upload.jks ]; then
            flutter build apk --release
          else
            echo 'No keystore secret — building unsigned (debug keys).'
            flutter build apk --release
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
            chronicle-${{ github.ref_name }}.apk

      - name: Install Linux build deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ninja-build cmake pkg-config
          libgtk-3-dev liblzma-dev sqlite3

      - name: Build Linux bundle tarball
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czvf $GITHUB_WORKSPACE/chronicle-linux-${{ github.ref_name }}.tar.gz *

      - name: Release notes from CHANGELOG
        run: |
          awk '/^## \[Unreleased\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md \
            > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "Release ${{ github.ref_name }}" > /tmp/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: |
            chronicle-${{ github.ref_name }}.apk
            chronicle-linux-${{ github.ref_name }}.tar.gz
