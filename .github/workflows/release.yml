name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
        timeout-minutes: 30
      # One invocation per file: a single `flutter test` run cannot host
      # multiple files that each boot the full app (later files fail to
      # attach). `flutter test` is headless, no xvfb needed.
      - run: for f in integration_test/*_test.dart; do flutter test "$f" --no-pub || exit 1; done
        timeout-minutes: 30

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/chronicle-upload.jks

      - name: Build signed universal APK
        env:
          CHRONICLE_KEYSTORE: ${{ github.workspace }}/android/keystore/chronicle-upload.jks
          CHRONICLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONICLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONICLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f android/keystore/chronicle-upload.jks ]; then
            flutter build apk --release
          else
            echo 'No keystore secret — building unsigned (debug keys).'
            flutter build apk --release
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
            chronicle-${{ github.ref_name }}.apk

      - name: Install Linux build deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ninja-build cmake pkg-config
          libgtk-3-dev liblzma-dev sqlite3

      - name: Build Linux bundle tarball
        run: |
          flutter build linux --release
          # drift loads sqlite via dlopen("libsqlite3.so"): ship a copy in
          # bundle/lib. The chronicle binary carries $ORIGIN/lib in its
          # RUNPATH, so it finds the bundled copy with no launcher script.
          SQLITE_SO=$(ldconfig -p | grep -m1 'libsqlite3.so.0 ' | awk '{print $NF}')
          cp "$SQLITE_SO" build/linux/x64/release/bundle/lib/libsqlite3.so
          cd build/linux/x64/release/bundle
          tar -czvf $GITHUB_WORKSPACE/chronicle-linux-${{ github.ref_name }}.tar.gz *

      - name: Build AppImage
        run: |
          BUNDLE=build/linux/x64/release/bundle
          rm -rf AppDir && mkdir -p AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/192x192/apps
          # Bundle tree preserved verbatim under usr/bin: the binary finds
          # lib/ via its own $ORIGIN/lib RUNPATH and data/ next to itself.
          cp -r "$BUNDLE/." AppDir/usr/bin/
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/chronicle.desktop AppDir/com.chronicleapp.chronicle.desktop
          cp packaging/chronicle.desktop AppDir/usr/share/applications/
          cp packaging/com.chronicleapp.chronicle.png AppDir/com.chronicleapp.chronicle.png
          cp packaging/com.chronicleapp.chronicle.png \
            AppDir/usr/share/icons/hicolor/192x192/apps/
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream \
            AppDir "$GITHUB_WORKSPACE/chronicle-${{ github.ref_name }}-x86_64.AppImage"

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - name: Build Flatpak bundle
        run: |
          BUNDLE=build/linux/x64/release/bundle
          STAGE=packaging/flatpak/stage
          rm -rf "$STAGE" repo flatpak-build && mkdir -p "$STAGE"
          cp -r "$BUNDLE/." "$STAGE/"
          cp packaging/chronicle.desktop "$STAGE/com.chronicleapp.chronicle.desktop"
          cp packaging/com.chronicleapp.chronicle.png "$STAGE/com.chronicleapp.chronicle.png"
          flatpak-builder --force-clean --repo=repo --default-branch=stable \
            flatpak-build packaging/flatpak/com.chronicleapp.chronicle.yml
          flatpak build-bundle repo \
            "$GITHUB_WORKSPACE/chronicle-${{ github.ref_name }}.flatpak" \
            com.chronicleapp.chronicle stable

      - name: Release notes from CHANGELOG
        run: |
          awk '/^## \[Unreleased\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md \
            > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "Release ${{ github.ref_name }}" > /tmp/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: |
            chronicle-${{ github.ref_name }}.apk
            chronicle-linux-${{ github.ref_name }}.tar.gz
            chronicle-${{ github.ref_name }}-x86_64.AppImage
            chronicle-${{ github.ref_name }}.flatpak
